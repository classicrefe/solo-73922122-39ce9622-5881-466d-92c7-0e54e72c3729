services:
  app1:
    build: .
    restart: unless-stopped
    environment:
      VCF_DATA_DIR: /data
      VCF_INSTANCE_ID: app1
    volumes:
      - vcfdata:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 3s
      retries: 5

  app2:
    build: .
    restart: unless-stopped
    environment:
      VCF_DATA_DIR: /data
      VCF_INSTANCE_ID: app2
    volumes:
      - vcfdata:/data
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  vcfdata:
